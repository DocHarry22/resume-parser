services:
  resume-parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Keep the API private behind the site's HTTPS reverse proxy.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: INFO
      DEBUG: "false"
      DATA_DIR: /var/lib/resume-parser
      TAXONOMY_DIR: /app/data
      SPACY_MODEL: en_core_web_md
      CORS_ORIGINS: '${CORS_ORIGINS:-["https://resume.docheng.co.za"]}'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      WORKSPACE_SECRET: ${WORKSPACE_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
    volumes:
      - resume-data:/var/lib/resume-parser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  resume-data:
