# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# PROPOSAL ONLY. Free compute has no fixed monthly fee; usage limits still apply.
# No persistent disk, external database, paid AI, custom domain or DNS changes.
# Browser documents persist locally; this API profile must not retain server records.
previews:
  generation: "off"

services:
  - type: web
    name: careerforge-resume-api-free
    runtime: docker
    repo: https://github.com/DocHarry22/resume-parser
    branch: codex/career-platform-upgrade
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    dockerfilePath: ./deploy/Dockerfile.free
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_MODE
        value: local
      - key: DATA_DIR
        value: /tmp/resume-parser
      - key: TAXONOMY_DIR
        value: /app/data
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: MAX_FILE_SIZE_MB
        value: "2"
      - key: MAX_EXTRACTED_CHARACTERS
        value: "60000"
      - key: MAX_PDF_PAGES
        value: "20"
      - key: MAX_DOCX_EXPANDED_MB
        value: "8"
      - key: MAX_CONCURRENT_PROCESSING
        value: "1"
      - key: REQUEST_BODY_TIMEOUT_SECONDS
        value: "30"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: '["https://resume.docheng.co.za"]'
      - key: RATE_LIMIT_REQUESTS
        value: "60"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
